name: ApolloRebornWidgets

options:
  bundleIdPrefix: com.christianselig.Apollo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # We always build unsigned; the user's sideload signer (Feather/AltStore/
    # SideStore/Sideloadly) re-seals the whole app + plugins with their cert.
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    ENABLE_BITCODE: NO

targets:
  ApolloRebornWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources
      # Pal Home: the app's own pixel-art room renderer (Foundation/CoreGraphics
      # only), compiled in so the widget draws exactly the room the app does.
      - path: ../src/palhome/ApolloPixelCanvas.m
      - path: ../src/palhome/ApolloPalHomeCatalog.m
      - path: ../src/palhome/ApolloPalHomeSurfaces.m
      - path: ../src/palhome/ApolloPalHomeFurniture.m
      - path: ../src/palhome/ApolloPalHomeWallItems.m
      - path: ../src/palhome/ApolloPalHomeThemedItems.m
      - path: ../src/palhome/ApolloPalHomeHalloween.m
      - path: ../src/palhome/ApolloPalHomeStyles.m
      - path: ../src/palhome/ApolloPalHomeRenderer.m
      - path: ../src/palhome/ApolloPalHomeChrome.m
      - path: ../src/palhome/ApolloPixelPalCoats.m
      - path: ../src/palhome/ApolloPalHomeStore.m
      - path: ../src/palhome/ApolloPalHomeShelter.m
      - path: ../src/palhome/ApolloPalSpecies.m
      - path: ../src/palhome/ApolloRebornPalSprites.m
      - path: ../src/palhome/ApolloPalHomeWidgetRenderer.m
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Apollo Widgets
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # Nested under the host app's bundle id so iOS attributes these widgets
        # to Apollo (they show under "Apollo" in the widget gallery).
        PRODUCT_BUNDLE_IDENTIFIER: com.christianselig.Apollo.RebornWidgets
        PRODUCT_NAME: ApolloRebornWidgets
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        # Fully system-linked; no embedded Swift runtime needed on iOS 17+.
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: NO
        # Generate the INIntent subclass from the .intentdefinition. We use the
        # classic SiriKit IntentConfiguration (not AppIntents) because AppIntents
        # widget metadata does NOT survive third-party sideload re-signing,
        # whereas SiriKit IntentConfiguration does.
        INTENTS_CODEGEN_LANGUAGE: Swift
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PalHomeBridge.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../src
        CLANG_ENABLE_OBJC_ARC: YES
