name: ApolloSiri

options:
  deploymentTarget:
    iOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    TARGETED_DEVICE_FAMILY: "1,2"

# This builds ONLY a framework. Its code and extracted metadata are injected
# into the real Apollo app by scripts/inject-siri-proof.sh.
targets:
  ApolloSiri:
    type: framework
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.apolloreborn.Siri
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO

  ApolloSiriTests:
    # Hostless XCTest BUNDLE, not a test application. AppIntentsTesting dispatches
    # to the already installed real Apollo by bundle identifier.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.apolloreborn.SiriTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: ""
        BUNDLE_LOADER: ""

schemes:
  ApolloSiri:
    build:
      targets:
        ApolloSiri: all
    test:
      targets:
        - ApolloSiriTests
