name: 🐞 Bug Report
description: Report a bug, crash, or broken feature in Apollo Reborn
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the sections below so we can reproduce and fix the issue quickly.

        **Please include a debug log or crash log.** It's the most useful thing you can give us, and without one we may not be able to solve your issue. The easiest way is to report from inside the app: **Settings → Apollo Reborn → Bug Reports** attaches your log for you, and you don't need a GitHub account.

        Have an idea or a feature request? Post it on [request.apolloreborn.app](https://request.apolloreborn.app/) instead (no log needed).

        Before submitting, please [search existing issues](https://github.com/Apollo-Reborn/Apollo-Reborn/issues?q=is%3Aissue) to avoid duplicates.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this hasn't been reported yet.
          required: true
        - label: I'm running the latest version of Apollo Reborn.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: When I scroll past an unmuted video in comments, the audio stops...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Scroll to '...'
        4. See the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  # No `render:` on purpose: a rendered (code block) textarea can't take file
  # attachments. The "Debug log or crash log" label is what
  # .github/scripts/issue-log-check.js looks for, so keep the two in sync.
  - type: textarea
    id: logs
    attributes:
      label: Debug log or crash log
      description: |
        Strongly recommended. Drag the file into this box, or use the attach-files link under it.

        - **Debug log:** reproduce the bug, then (before closing Apollo) go to **Settings → Apollo Reborn → Advanced → Export Debug Logs** and save the `.log` file, e.g. with Save to Files. The log only covers the current app session.
        - **Crash:** also attach the crash report: **Settings → Apollo Reborn → Privacy → Crash Reports**, open the report, then **Export Sanitized Report…**. If Apollo didn't record one, use the `Apollo-…` `.ips` file from iOS **Settings → Privacy & Security → Analytics & Improvements → Analytics Data**. GitHub doesn't accept `.ips` files, so zip it first (or paste its contents here).

        Logs never include passwords or API keys, but like everything here they're public.
      placeholder: Attach your apollo-reborn-….log file here.
    validations:
      required: false

  # A log is optional, but continuing without one is a deliberate answer that
  # comes with the warning.
  - type: dropdown
    id: log-attached
    attributes:
      label: Did you attach a debug log or crash log?
      description: Without a log we may not be able to figure out or fix your issue.
      options:
        - "Yes, it's attached above"
        - "No, continue without a log (I understand my issue may not get fixed without one)"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recordings
      description: Drag and drop screenshots or screen recordings here.
    validations:
      required: false

  - type: input
    id: tweak-version
    attributes:
      label: Apollo Reborn version
      description: Found in Settings → Apollo Reborn → scroll to bottom, or the IPA filename (e.g. `Apollo-Reborn-3.3.0.ipa`).
      placeholder: "3.3.0"
    validations:
      required: true

  - type: input
    id: ios-version
    attributes:
      label: iOS version
      placeholder: "iOS 26.5.1"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "iPhone 16 Pro"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      description: How did you install the IPA?
      options:
        - AltStore Classic/SideStore
        - Feather
        - LiveContainer
        - Sideloadly
        - Impactor
        - TrollStore
        - Jailbreak (.deb tweak)
        - Other
    validations:
      required: true

  - type: dropdown
    id: livecontainer
    attributes:
      label: Are you running Apollo Reborn through LiveContainer?
      description: |
        LiveContainer is an app that runs other apps *inside itself* instead of installing them normally. If you added the Apollo Reborn IPA to LiveContainer and launch Apollo from there (including from a LiveContainer Home Screen shortcut), answer **Yes**. If Apollo Reborn was installed as its own app with AltStore/SideStore/Feather/Sideloadly/TrollStore etc., answer **No**.

        LiveContainer isn't officially supported, so this helps us tell LiveContainer-only problems apart from real Apollo Reborn bugs. If you answered Yes and are able to, please check whether the bug also happens with Apollo Reborn installed directly.
      options:
        - "No, LiveContainer isn't installed on this device"
        - "No, LiveContainer is installed, but Apollo Reborn is its own separate app"
        - "Yes, Apollo Reborn runs inside LiveContainer"
        - "Not sure"
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: IPA variant
      description: Which build are you running?
      options:
        - Standard
        - No Extensions
        - Liquid Glass
        - Liquid Glass + No Extensions
        - Glass Icons
        - Glass Icons + No Extensions
        - N/A (used jailbreak with .deb tweak)
    validations:
      required: true

  - type: dropdown
    id: was-existing-apollo-bug
    attributes:
      label: Was this a previously existing Apollo bug?
      description: Do you know if this bug existed in the original Apollo app, or is it new to the Apollo Reborn tweak? You can also check the [original Apollo bug tracker](https://github.com/christianselig/apollo-bugs/issues) to see if it's been reported there.
      options:
        - "No"
        - "Yes"
        - "Not sure"
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help — custom API keys in use, recently changed settings, other related bug reports, etc.
    validations:
      required: false
